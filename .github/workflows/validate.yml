name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate static pages
        run: node scripts/generate-site.mjs
      - name: Ensure generated output is committed
        run: git diff --exit-code
      - name: Validate routes and JavaScript
        run: |
          node content-routes/validate.mjs
          node --check script.js
          node --check content-routes/route-search.js
          node --check visitor-map/script.js
          node --check visitor-insights/script.js
          node --check scripts/blog-posts.mjs
      - name: Test privacy-preserving analytics
        run: python -m unittest analytics.test_aggregate -v
