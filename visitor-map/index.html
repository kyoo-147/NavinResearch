<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Coarse, privacy-preserving visitor geography for Navin Research.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#03120d">
    <title>Visitor map · Navin Research</title>
    <link rel="icon" href="/assets/brand/logo_icon_tab.png" type="image/png">
    <link rel="stylesheet" href="/visitor-map/style.css?v=20260830-all-countries">
    <script src="/visitor-map/script.js?v=20260830-all-countries" defer></script>
  </head>
  <body>
    <main class="wrap">
      <header>
        <a class="map-brand" href="/"><img src="/assets/brand/logo.webp" alt="" width="56" height="56"><span>NAVIN RESEARCH</span></a>
        <span>PUBLIC / AGGREGATE</span>
      </header>
      <section class="dashboard">
        <div class="globe">
          <canvas id="visitor-globe" role="img" aria-label="Rotating globe showing coarse aggregate visitor countries"></canvas>
        </div>
        <div class="panel">
          <div class="panel-title"><span>Last published</span><strong id="date">—</strong></div>
          <p class="demo-badge" id="demo-badge" hidden>DEMO DATA</p>
          <ol id="countries" aria-live="polite"></ol>
          <p class="note" id="status" hidden></p>
        </div>
      </section>
      <footer>
        <a href="/">About Navin Research ↗</a>
      </footer>
    </main>
  </body>
</html>
