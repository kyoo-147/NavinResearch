# Include/adapt inside the dedicated navinresearch.com HTTPS server block.
# Never place these locations in a shared/default server.

access_log /var/log/nginx/navinresearch.access.log combined;

# Direct-to-origin deployment: $remote_addr is the visitor address.
# If a CDN/reverse proxy is added later, trust ONLY its documented CIDRs and
# select its verified address header. Never use 0.0.0.0/0 as a trusted proxy.
# set_real_ip_from 203.0.113.0/24;  # replace with an actual trusted proxy CIDR
# real_ip_header CF-Connecting-IP;  # replace for the chosen proxy
# real_ip_recursive on;

# Serve public Markdown notes inline with an explicit type. The main server
# keeps `X-Content-Type-Options: nosniff`, so the default octet-stream type
# would otherwise force downloads in browsers and some crawlers.
location ~ \.md$ {
    default_type text/markdown;
    charset utf-8;
    try_files $uri =404;
    expires 5m;
}

location = /visitor-map/ {
    try_files /visitor-map/index.html =404;
}

location = /visitor-map/data.json {
    alias /var/lib/navin-analytics/public.json;
    add_header Cache-Control "public, max-age=300" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location = /visitor-insights/data.json {
    auth_basic "Private Navin Research visitor insights";
    auth_basic_user_file /etc/nginx/navinresearch.htpasswd;
    alias /var/lib/navin-analytics/private.json;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location ^~ /visitor-insights/ {
    auth_basic "Private Navin Research visitor insights";
    auth_basic_user_file /etc/nginx/navinresearch.htpasswd;
    try_files $uri $uri/ =404;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# Keep SQLite, GeoLite2, raw logs, output JSON, and credentials outside web root.
# Create credentials interactively and never commit them:
#   htpasswd -c /etc/nginx/navinresearch.htpasswd navin-admin
#
# Process one complete Navin-specific chronological log on a timer.
# See analytics/README.md for the atomic output command.
