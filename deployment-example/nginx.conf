# Example snippets; adapt paths and include from your server block.
location = /visitor-map/ { try_files /visitor-map/index.html =404; }
location = /visitor-map/data.json { add_header Cache-Control "public, max-age=300"; try_files $uri =404; }
location /visitor-insights/ {
    auth_basic "Private visitor insights";
    auth_basic_user_file /etc/nginx/.htpasswd;
    try_files $uri $uri/ =404;
}
# Keep generated DB/MMDB outside the web root and out of source control.
# Run the batch job from cron/systemd timer, for example daily at 03:20:
# 20 3 * * * cd /srv/navin && /usr/bin/python3 analytics/aggregate.py /var/log/nginx/access.log --mmdb /srv/private/GeoLite2-City.mmdb
